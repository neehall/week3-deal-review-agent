<text x="1366" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">finalize</text>
<text x="1366" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Write final report</text>
<text x="60" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#171a1f" text-anchor="start">File-by-File Index</text>
<text x="60" y="646" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#454b54" text-anchor="start">Grouped the same way as docs/CODE_MAP.md.</text>
<rect x="60" y="670" width="728.0" height="328" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="78" y="694" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit A — Entry &amp; Orchestration (app/)</text>
<text x="78" y="718" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">streamlit_app.py</text>
<text x="92" y="738" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Upload UI, runs the graph, shows the report, collects the human decision, renders the observability</text>
<text x="92" y="755" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">panel.</text>
<text x="78" y="784" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">graph.py</text>
<text x="92" y="804" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Wires the LangGraph StateGraph: 6 nodes, SqliteSaver checkpointing, interrupts before finalize.</text>
<text x="78" y="833" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">state.py</text>
<text x="92" y="853" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">DealReviewState + the 3 agents' structured-output schemas, threaded through every node.</text>
<text x="78" y="882" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">config.py</text>
<text x="92" y="902" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Loads .env, builds the shared Claude client. max_tokens=4096 after a real truncation bug.</text>
<text x="78" y="931" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">observability.py</text>
<text x="92" y="951" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">trace()/audit()/node_span()/stage_summary() — powers the UI's live per-run panel.</text>
<rect x="812.0" y="670" width="728.0" height="360" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="830.0" y="694" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit B — Agents (app/agents/)</text>
<text x="830.0" y="718" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">prompts.py</text>
<text x="844.0" y="738" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">One system prompt per agent — identity + guardrails, incl. prompt-injection resistance.</text>
<text x="830.0" y="767" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">_llm_utils.py</text>
<text x="844.0" y="787" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">structured_call_with_retry() — sends system + task prompt, retries once on parse failure.</text>
<text x="830.0" y="816" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">extractor.py</text>
<text x="844.0" y="836" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Agent 1 (LLM). Pulls parties, amount, rate, term, clauses, dates from raw text.</text>
<text x="830.0" y="865" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">compliance.py</text>
<text x="844.0" y="885" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Agent 2 (LLM). Checks terms vs. rules.yaml: pass/fail/unclear + evidence. Never guesses a pass.</text>
<text x="830.0" y="914" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">risk.py</text>
<text x="844.0" y="934" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Agent 3 (LLM). Severity-rated risk findings, including risks no rule covers.</text>
<text x="830.0" y="963" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">orchestrator.py</text>
<text x="844.0" y="983" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">No LLM call. Deterministically merges all three agents' output into the draft report.</text>
<rect x="60" y="1018" width="728.0" height="311" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="78" y="1042" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit C — Tools, Data &amp; Evaluation</text>
<text x="78" y="1066" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">tools/document_loader.py</text>
<text x="92" y="1086" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Parses PDF/DOCX/TXT/MD. Raises DocumentLoadError — never guesses at content.</text>
<text x="78" y="1115" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">data/compliance/rules.yaml</text>
<text x="92" y="1135" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">6 synthetic compliance rules: rate cap, date, termination clause, parties, arbitration, amount.</text>
<text x="78" y="1164" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">data/sample_deals/</text>
<text x="92" y="1184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">20 test documents across 4 tiers (normal/failing/edge_cases/extreme) + ANSWER_KEY.md.</text>
<text x="78" y="1213" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">ragas_eval.py</text>
<text x="92" y="1233" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">ragas Faithfulness check — scores the draft report's groundedness in the source document.</text>
<text x="78" y="1262" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">scripts/run_ragas_faithfulness.py</text>
<text x="92" y="1282" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Runs the pipeline + faithfulness check over a cost-conscious sample of deals.</text>
<rect x="812.0" y="1050" width="728.0" height="360" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="830.0" y="1074" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#171a1f" text-anchor="start">Exhibit D — Tests &amp; Documentation</text>
<text x="830.0" y="1098" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">tests/test_document_loader.py</text>
<text x="844.0" y="1118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Covers load_document()'s error paths — no API key required.</text>
<text x="830.0" y="1147" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">tests/test_orchestrator.py</text>
<text x="844.0" y="1167" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Covers the orchestrator's merge logic and partial-failure handling.</text>
<text x="830.0" y="1196" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">FRAMEWORK.md</text>
<text x="844.0" y="1216" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The one-liner + full agent framework, written before any code.</text>
<text x="830.0" y="1245" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">docs/ARCHITECTURE.md</text>
<text x="844.0" y="1265" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">System diagrams, human-in-the-loop sequence, state schema, failure handling.</text>
<text x="830.0" y="1294" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">docs/PROJECT_WRITEUP.md</text>
<text x="844.0" y="1314" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">The submission write-up — overview, datasets, prompts, iterations, learnings.</text>
<text x="830.0" y="1343" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">CHANGELOG.md</text>
<text x="844.0" y="1363" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#454b54" text-anchor="start">Full commit-by-commit project history.</text>
