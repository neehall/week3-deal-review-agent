<text x="60" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#171a1f" text-anchor="start">The Pipeline, in Order</text>
<text x="60" y="436" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#454b54" text-anchor="start">What runs, node by node, when a document is uploaded — from app/graph.py. The graph always pauses at the dashed node for a human decision.</text>
<rect x="60" y="460" width="190" height="92" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="76" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">load_document</text>
<text x="76" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Parse PDF / DOCX /</text>
<text x="76" y="530" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">TXT</text>
<path d="M254 506.0 L263 506.0 M255 499.0 L263 506.0 L255 513.0" fill="none" stroke="#454b54" stroke-width="2" opacity="0.6"/>
<rect x="275" y="460" width="190" height="92" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="291" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">extractor_agent</text>
<text x="291" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Pull structured terms</text>
<path d="M469 506.0 L478 506.0 M470 499.0 L478 506.0 L470 513.0" fill="none" stroke="#454b54" stroke-width="2" opacity="0.6"/>
<rect x="490" y="460" width="190" height="92" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="506" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">compliance_agent</text>
<text x="506" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Check terms vs. rules</text>
<path d="M684 506.0 L693 506.0 M685 499.0 L693 506.0 L685 513.0" fill="none" stroke="#454b54" stroke-width="2" opacity="0.6"/>
<rect x="705" y="460" width="190" height="92" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="721" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">risk_agent</text>
<text x="721" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Rate + narrate risk</text>
<path d="M899 506.0 L908 506.0 M900 499.0 L908 506.0 L900 513.0" fill="none" stroke="#454b54" stroke-width="2" opacity="0.6"/>
<rect x="920" y="460" width="190" height="92" rx="4" fill="#f8f9f8" stroke="#c9cdc9"/>
<text x="936" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">orchestrator_compile</text>
<text x="936" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Merge into draft</text>
<text x="936" y="530" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">report</text>
<path d="M1114 506.0 L1123 506.0 M1115 499.0 L1123 506.0 L1115 513.0" fill="none" stroke="#454b54" stroke-width="2" opacity="0.6"/>
<rect x="1135" y="460" width="190" height="92" rx="4" fill="#f1e2e2" stroke="#7a2e3a" stroke-dasharray="5,4"/>
<text x="1151" y="490" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#7a2e3a" text-anchor="start">⏸ human review</text>
<text x="1151" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Approve / edit /</text>
<text x="1151" y="530" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">reject</text>
