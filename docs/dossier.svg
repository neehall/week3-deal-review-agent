<text x="60" y="1484" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#171a1f" text-anchor="start">State schema — what flows through every node</text>
<text x="60" y="1510" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">deal_id</text>
<text x="430" y="1510" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">UUID run identity — the checkpoint thread &amp; trace/audit filename key.</text>
<text x="60" y="1534" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">raw_text / extracted_terms</text>
<text x="430" y="1534" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Parsed document text, then the extractor's structured output.</text>
<text x="60" y="1558" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">compliance_findings / risk_findings</text>
<text x="430" y="1558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Pass/fail/unclear list, then severity-rated risk findings.</text>
<text x="60" y="1582" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">draft_report / final_report</text>
<text x="430" y="1582" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Orchestrator's merged report; final_report only set once approved.</text>
<text x="60" y="1606" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#7a2e3a" text-anchor="start">errors / needs_manual_review</text>
<text x="430" y="1606" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#454b54" text-anchor="start">Accumulated failures — a run degrades gracefully, never crashes silently.</text>
